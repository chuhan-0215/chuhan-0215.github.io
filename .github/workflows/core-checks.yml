name: Core source checks
on:
  pull_request:
  push:
    branches: [gh-pages]
permissions:
  contents: read
jobs:
  verify:
    name: Core BVT
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public biography and privacy constraints
        run: python scripts/check_public.py .
